name: Daily Amazon Link Check

on:
  schedule:
    - cron: '0 9 * * *'    # runs every day at 9:00 AM UTC (5 AM Eastern)
  workflow_dispatch:        # also runnable manually from the Actions tab

permissions:
  contents: write    # commit tools/link_status.json
  actions: write     # dispatch the deploy workflow

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Run the checker — exits 0 (all ok) or 1 (broken/errors found)
      - name: Run link checker
        id: link_check
        run: |
          python3 tools/check_links.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true   # don't fail the job here; we handle it below

      # Persist which links are hidden. If the set of hidden links changed,
      # commit the status file and redeploy so R2 + the website pick it up
      # (merge_recipes.py blanks disabled links in the published recipes.json).
      - name: Commit link status and redeploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "YesChef Link Checker"
          git config user.email "actions@users.noreply.github.com"
          git add tools/link_status.json
          if git diff --cached --quiet; then
            echo "No link status changes."
            exit 0
          fi
          git commit -m "chore: update Amazon link status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main

      # Read the markdown report into a variable for the email body
      - name: Read report
        id: read_report
        if: always()
        run: |
          # GitHub Actions has a limit on multiline env vars; use a file ref
          echo "report_file=link_report.md" >> $GITHUB_OUTPUT

      # Send email ONLY when broken/error links are found (exit code 1)
      - name: Send alert email
        if: steps.link_check.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASS }}
          subject: "⚠️ YesChef: Amazon link issues detected"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: "YesChef Link Checker <${{ secrets.ALERT_EMAIL_USER }}>"
          body: |
            One or more Amazon affiliate links in YesChef are broken, erroring, or out of stock.

            View the full report in the Actions run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The link_report.md artifact is attached to that run with full details
            including which recipes are affected.

            — YesChef Automation
          # Attach the markdown report directly to the email
          attachments: link_report.md

      # Always upload the report as an artifact (visible in Actions tab)
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report-${{ github.run_id }}
          path: |
            link_report.md
            link_report.json
          retention-days: 30    # keeps the last 30 days of reports
